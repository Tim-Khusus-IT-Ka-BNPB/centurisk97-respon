<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test gateway</title>
    <link rel="stylesheet" href="/page.css" />
  </head>
  <body>
    <aside class="numbers" aria-label="Numbers">
      <header>
        <h1>Test gateway</h1>
        <p class="lead">Stands in for WhatsApp on this machine. Nothing is sent to a real number.</p>
      </header>
      <form id="open">
        <label class="label" for="number">Write as a number</label>
        <div class="row">
          <input id="number" name="number" inputmode="tel" autocomplete="off" placeholder="0800 0000 0101" required />
          <button type="submit">Open</button>
        </div>
        <p id="refused" class="refused" role="alert"></p>
      </form>
      <ul id="chats"></ul>
    </aside>
    <main class="chat">
      <header class="who">
        <span class="face" aria-hidden="true">PB</span>
        <div>
          <h2>Pantau Bencana BNPB</h2>
          <p id="as" class="small">Pick a number to write as</p>
        </div>
      </header>
      <ol id="messages" class="messages" aria-live="polite"></ol>
      <form id="send" class="composer">
        <div class="tools">
          <label class="tool" for="photo">Photo</label>
          <input id="photo" type="file" accept="image/jpeg" class="hidden" />
          <button type="button" class="tool" id="locate" aria-expanded="false" aria-controls="place">Location</button>
        </div>
        <label for="text" class="hidden">Message</label>
        <textarea id="text" rows="1" placeholder="Message" disabled></textarea>
        <button type="submit" disabled>Send</button>
        <div id="place" class="place" hidden>
          <label class="label" for="point">Latitude, longitude</label>
          <input id="point" value="5.14705, 97.0482" autocomplete="off" />
          <button type="button" id="share">Share location</button>
        </div>
      </form>
    </main>
    <script src="/page.js"></script>
  </body>
</html>
